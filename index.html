<style>
  :root {
    --bg: #0d0d0f;
    --text: #ece9e5;
    --muted: #8b8781;
    --border: #26262a;
    --border-hover: #3a3a40;
    --btn-bg: transparent;
    --btn-bg-hover: #161619;
    --accent: #c2607e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  /* ---- avatar ---- */
  .avatar-wrap {
    position: relative;
    width: 104px;
    height: 104px;
    margin: 0 auto 24px;
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--border);
    display: block;
  }

  .avatar-fallback {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #1a1a1e;
    border: 1px solid var(--border);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 600;
    color: var(--accent);
  }

  .avatar-failed { display: none; }
  .avatar-failed + .avatar-fallback { display: flex; }

  /* ---- identity ---- */
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin-bottom: 12px;
  }

  .bio {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.75;
    margin-bottom: 20px;
  }

  .quote {
    font-size: 14px;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 36px;
    letter-spacing: 0.3px;
  }

  .quote::before,
  .quote::after {
    color: var(--accent);
    opacity: 0.7;
  }
  .quote::before { content: "“"; }
  .quote::after { content: "”"; }

  /* ---- links ---- */
  .links {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .links a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--btn-bg);
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .links a:hover {
    background: var(--btn-bg-hover);
    border-color: var(--border-hover);
  }

  .links a svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    fill: currentColor;
    opacity: 0.85;
  }

  .links a span.label {
    flex: 1;
    text-align: left;
  }

  .links a span.arrow {
    color: var(--muted);
    font-size: 14px;
    transition: transform 0.2s ease, color 0.2s ease;
  }

  .links a:hover span.arrow {
    transform: translateX(2px);
    color: var(--text);
  }

  /* ---- footer ---- */
  footer {
    margin-top: 40px;
    font-size: 12px;
    color: var(--muted);
    opacity: 0.7;
  }

  @media (max-width: 380px) {
    body { padding: 36px 20px; }
    .links a { padding: 13px 16px; font-size: 14.5px; }
  }
</style>
</head>
